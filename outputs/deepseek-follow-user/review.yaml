  includes all four exception branches in the correct priority order, each with `assignable \nothing`
  ensuring atomicity, and the normal branch establishes both relation directions and appends the
  success message. It also includes frame conditions protecting other users, user attributes, and
  global relation invariance. However, there are minor issues: the output-sequence frame includes
  `output` as a mutable object but the official interface does not declare an output mechanism; the
  use of `\num_of` over `containsUser` ranges is not fully precise (does not exclude the changed
  edges and may double count); the normal branch assigns `users[*]` which is too broad and conflicts
  with the more restrictive frame-condition ensures; and video/queue immutability is asserted only
  indirectly via user-level quantification, not explicitly.
issues:
